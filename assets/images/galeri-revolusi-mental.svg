<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="galRevBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#galRevBg)"/>
  
  <!-- Interactive Team Building Graphic -->
  <g transform="translate(180, 80)">
    <circle cx="220" cy="130" r="100" fill="none" stroke="rgba(254, 202, 202, 0.3)" stroke-width="2"/>
    <!-- Connected Team Nodes -->
    <line x1="220" y1="50" x2="140" y2="170" stroke="#fef08a" stroke-width="3"/>
    <line x1="220" y1="50" x2="300" y2="170" stroke="#fef08a" stroke-width="3"/>
    <line x1="140" y1="170" x2="300" y2="170" stroke="#fef08a" stroke-width="3"/>
    
    <circle cx="220" cy="50" r="28" fill="#fbbf24"/>
    <text x="220" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#450a0a" text-anchor="middle">LEAD</text>
    
    <circle cx="140" cy="170" r="28" fill="#ffffff"/>
    <text x="140" y="176" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#991b1b" text-anchor="middle">TEAM</text>
    
    <circle cx="300" cy="170" r="28" fill="#ffffff"/>
    <text x="300" y="176" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#991b1b" text-anchor="middle">ACTION</text>
  </g>

  <!-- Title & Details Overlay -->
  <rect x="40" y="440" width="720" height="120" rx="16" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
  <text x="70" y="485" font-family="'Outfit', sans-serif" font-size="26" font-weight="800" fill="#ffffff">Workshop Revolusi Mental</text>
  <text x="70" y="520" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#94a3b8">Program unggulan intensif membongkar mental block &amp; menumbuhkan sinergi</text>
  <g transform="translate(620, 470)">
    <rect width="110" height="34" rx="17" fill="#ef4444"/>
    <text x="55" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">WORKSHOP</text>
  </g>
</svg>
