<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="100%" height="100%">
  <defs>
    <linearGradient id="bookBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#311068"/>
    </linearGradient>
    <linearGradient id="magicAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow3D3">
      <feDropShadow dx="15" dy="20" stdDeviation="15" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#shadow3D3)">
    <rect x="50" y="30" width="500" height="780" rx="16" fill="url(#bookBg3)"/>
    <rect x="50" y="30" width="25" height="780" rx="4" fill="rgba(0,0,0,0.3)"/>
    <line x1="75" y1="30" x2="75" y2="810" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    
    <rect x="90" y="70" width="420" height="6" fill="url(#magicAcc)"/>

    <!-- Publisher Tag -->
    <g transform="translate(90, 95)">
      <rect width="150" height="28" rx="4" fill="rgba(255,255,255,0.1)"/>
      <text x="75" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#fbcfe8" text-anchor="middle" letter-spacing="1">PT. GRASSINDO</text>
    </g>

    <!-- Category Pill -->
    <g transform="translate(90, 150)">
      <rect width="230" height="32" rx="16" fill="#ec4899"/>
      <text x="115" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">PARENTING &amp; EMOTIONAL IQ</text>
    </g>

    <!-- Title -->
    <text x="90" y="240" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="40" font-weight="900" fill="#ffffff" letter-spacing="-0.5">MENANAM &amp;</text>
    <text x="90" y="295" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="42" font-weight="900" fill="#fbbf24" letter-spacing="-0.5">MENGASAH</text>
    <text x="90" y="350" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="48" font-weight="900" fill="#f472b6" letter-spacing="1">MAGIC ANAK</text>

    <!-- Magic Stars & Brain Potential Motif -->
    <g transform="translate(90, 420)">
      <circle cx="210" cy="110" r="95" fill="none" stroke="rgba(244, 114, 182, 0.3)" stroke-width="2"/>
      <!-- Glowing Star -->
      <polygon points="210,50 225,95 270,95 235,120 250,165 210,138 170,165 185,120 150,95 195,95" fill="url(#magicAcc)"/>
      <circle cx="150" cy="60" r="4" fill="#fbbf24"/>
      <circle cx="270" cy="55" r="5" fill="#f472b6"/>
      <circle cx="290" cy="150" r="4" fill="#38bdf8"/>
      <circle cx="130" cy="140" r="5" fill="#ffffff"/>
    </g>

    <text x="300" y="690" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" fill="#e9d5ff" text-anchor="middle" font-weight="500">Membentuk Karakter &amp; Sikap Mental Juara Sejak Usia Dini</text>

    <rect x="90" y="720" width="420" height="55" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(244, 114, 182, 0.4)" stroke-width="1.5"/>
    <text x="300" y="754" font-family="'Outfit', sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">Tatag Utomo, M.M., M.Si.</text>
  </g>
</svg>
