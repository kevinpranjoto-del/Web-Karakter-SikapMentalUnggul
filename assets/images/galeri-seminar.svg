<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="galSemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#galSemBg)"/>
  
  <!-- Seminar Stage & Audience Motif -->
  <g transform="translate(150, 60)">
    <!-- Stage Spotlights -->
    <polygon points="100,0 0,250 200,250" fill="#fef08a" opacity="0.15"/>
    <polygon points="400,0 300,250 500,250" fill="#fef08a" opacity="0.15"/>
    
    <!-- Stage Podium & Speaker -->
    <rect x="200" y="160" width="100" height="90" fill="#1e293b" rx="4"/>
    <ellipse cx="250" cy="110" rx="18" ry="22" fill="#e0ac69"/>
    <rect x="235" y="132" width="30" height="40" fill="#f59e0b" rx="4"/>
    <line x1="280" y1="120" x2="280" y2="160" stroke="#cbd5e1" stroke-width="3"/>
    
    <!-- Audience Silhouettes -->
    <circle cx="50" cy="270" r="16" fill="#0f172a"/>
    <circle cx="110" cy="265" r="18" fill="#0f172a"/>
    <circle cx="170" cy="272" r="16" fill="#0f172a"/>
    <circle cx="330" cy="270" r="17" fill="#0f172a"/>
    <circle cx="390" cy="265" r="18" fill="#0f172a"/>
    <circle cx="450" cy="272" r="16" fill="#0f172a"/>
  </g>

  <!-- Title & Details Overlay -->
  <rect x="40" y="440" width="720" height="120" rx="16" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
  <text x="70" y="485" font-family="'Outfit', sans-serif" font-size="26" font-weight="800" fill="#ffffff">Seminar Motivasi &amp; Leadership</text>
  <text x="70" y="520" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#94a3b8">Dihadiri ratusan pimpinan eksekutif, manajer korporat, dan asosiasi industri</text>
  <g transform="translate(620, 470)">
    <rect width="110" height="34" rx="17" fill="#6366f1"/>
    <text x="55" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">SEMINAR</text>
  </g>
</svg>
