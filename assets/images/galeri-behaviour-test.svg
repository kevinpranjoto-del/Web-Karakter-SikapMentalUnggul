<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="galTestBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#galTestBg)"/>
  
  <!-- Psychometric & Assessment Visual -->
  <g transform="translate(220, 80)">
    <!-- Clipboard & Checkmarks -->
    <rect x="50" y="20" width="260" height="230" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
    <rect x="130" y="5" width="100" height="25" rx="6" fill="#0f172a"/>
    
    <!-- Assessment Bars -->
    <rect x="80" y="60" width="200" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="80" y="60" width="160" height="12" rx="6" fill="#10b981"/>
    
    <rect x="80" y="95" width="200" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="80" y="95" width="180" height="12" rx="6" fill="#0284c7"/>
    
    <rect x="80" y="130" width="200" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="80" y="130" width="140" height="12" rx="6" fill="#f59e0b"/>

    <!-- Brain Icon in Stamp -->
    <circle cx="180" cy="190" r="35" fill="none" stroke="#0284c7" stroke-width="3" stroke-dasharray="4 4"/>
    <text x="180" y="196" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#0284c7" text-anchor="middle">ASSESSED</text>
  </g>

  <!-- Title & Details Overlay -->
  <rect x="40" y="440" width="720" height="120" rx="16" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
  <text x="70" y="485" font-family="'Outfit', sans-serif" font-size="26" font-weight="800" fill="#ffffff">Assessment &amp; Behaviour Test</text>
  <text x="70" y="520" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#94a3b8">Uji psikometri &amp; profiling potensi sikap mental individu dan kepemimpinan</text>
  <g transform="translate(620, 470)">
    <rect width="110" height="34" rx="17" fill="#0284c7"/>
    <text x="55" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">ASSESSMENT</text>
  </g>
</svg>
