<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="100%" height="100%">
  <defs>
    <linearGradient id="bookBg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow3D4">
      <feDropShadow dx="15" dy="20" stdDeviation="15" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#shadow3D4)">
    <rect x="50" y="30" width="500" height="780" rx="16" fill="url(#bookBg4)"/>
    <rect x="50" y="30" width="25" height="780" rx="4" fill="rgba(0,0,0,0.3)"/>
    <line x1="75" y1="30" x2="75" y2="810" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    
    <rect x="90" y="70" width="420" height="6" fill="url(#blueGold)"/>

    <!-- Publisher Tag -->
    <g transform="translate(90, 95)">
      <rect width="150" height="28" rx="4" fill="rgba(255,255,255,0.1)"/>
      <text x="75" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#bae6fd" text-anchor="middle" letter-spacing="1">PT. GRASSINDO</text>
    </g>

    <!-- Category Pill -->
    <g transform="translate(90, 150)">
      <rect width="250" height="32" rx="16" fill="#0284c7"/>
      <text x="125" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">CORPORATE CULTURE &amp; ETHICS</text>
    </g>

    <!-- Title -->
    <text x="90" y="235" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="-0.5">KEWENANGAN</text>
    <text x="90" y="280" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900" fill="#fbbf24">BERPIKIR,</text>
    <text x="90" y="325" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900" fill="#38bdf8">BERUCAP,</text>
    <text x="90" y="370" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900" fill="#fbbf24">BERBUAT</text>
    <text x="90" y="415" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="30" font-weight="800" fill="#ffffff">PERUSAHAAN</text>

    <!-- Pillar Columns Motif -->
    <g transform="translate(90, 440)">
      <circle cx="210" cy="110" r="95" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2"/>
      <!-- 3 Pillars of Authority -->
      <rect x="140" y="50" width="35" height="110" rx="4" fill="#38bdf8" opacity="0.8"/>
      <rect x="192" y="30" width="36" height="130" rx="4" fill="#fbbf24"/>
      <rect x="245" y="50" width="35" height="110" rx="4" fill="#38bdf8" opacity="0.8"/>
      <!-- Connecting Bridge -->
      <rect x="120" y="20" width="180" height="16" rx="4" fill="#ffffff"/>
      <rect x="110" y="160" width="200" height="16" rx="4" fill="#ffffff"/>
    </g>

    <text x="300" y="690" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" fill="#cbd5e1" text-anchor="middle" font-weight="500">Membangun Budaya Integritas &amp; Sinergi Manajemen</text>

    <rect x="90" y="720" width="420" height="55" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
    <text x="300" y="754" font-family="'Outfit', sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">Tatag Utomo, M.M., M.Si.</text>
  </g>
</svg>
