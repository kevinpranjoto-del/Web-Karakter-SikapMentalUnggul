<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c"/>
      <stop offset="50%" stop-color="#1e3e62"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#fda085"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2b45"/>
      <stop offset="100%" stop-color="#0b1320"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0ac69"/>
      <stop offset="100%" stop-color="#c68642"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="900" fill="url(#bgGrad)"/>
  
  <!-- Subtle geometric grid lines -->
  <circle cx="400" cy="400" r="320" fill="none" stroke="rgba(246, 211, 101, 0.15)" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="400" cy="400" r="240" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <circle cx="400" cy="360" r="180" fill="url(#goldGrad)" opacity="0.12" filter="url(#glow)"/>

  <!-- Character Illustration (Executive Trainer) -->
  <!-- Shoulders & Suit -->
  <path d="M180 900 C200 680, 260 600, 400 600 C540 600, 600 680, 620 900 Z" fill="url(#suitGrad)"/>
  <!-- White Shirt Collar -->
  <polygon points="360,600 440,600 400,720" fill="#ffffff"/>
  <!-- Tie -->
  <polygon points="385,630 415,630 422,820 400,860 378,820" fill="url(#goldGrad)"/>
  <!-- Suit Lapels -->
  <path d="M300 620 L370 760 L360 900 L260 900 Z" fill="#152238"/>
  <path d="M500 620 L430 760 L440 900 L540 900 Z" fill="#152238"/>

  <!-- Neck -->
  <rect x="360" y="470" width="80" height="150" fill="url(#skinGrad)" rx="10"/>

  <!-- Head / Face -->
  <ellipse cx="400" cy="380" rx="105" ry="125" fill="url(#skinGrad)"/>

  <!-- Hair -->
  <path d="M290 360 C290 260, 350 240, 400 240 C450 240, 510 260, 510 360 C490 320, 470 300, 400 300 C330 300, 310 320, 290 360 Z" fill="#1a1a1a"/>

  <!-- Glasses -->
  <rect x="320" y="360" width="65" height="42" rx="8" fill="none" stroke="#f6d365" stroke-width="5"/>
  <rect x="415" y="360" width="65" height="42" rx="8" fill="none" stroke="#f6d365" stroke-width="5"/>
  <line x1="385" y1="380" x2="415" y2="380" stroke="#f6d365" stroke-width="5"/>

  <!-- Eyes & Smile -->
  <circle cx="352" cy="381" r="7" fill="#222"/>
  <circle cx="447" cy="381" r="7" fill="#222"/>
  <path d="M365 440 Q400 470 435 440" fill="none" stroke="#773d15" stroke-width="5" stroke-linecap="round"/>

  <!-- Overlay Graphic / Modern Banner Card at Bottom -->
  <g transform="translate(80, 720)" filter="url(#cardShadow)">
    <rect width="640" height="135" rx="16" fill="rgba(11, 25, 44, 0.95)" stroke="rgba(246, 211, 101, 0.4)" stroke-width="1.5"/>
    
    <!-- Gold badge icon -->
    <circle cx="65" cy="67" r="34" fill="url(#goldGrad)"/>
    <path d="M65 48 L70 59 L82 61 L73 70 L75 82 L65 76 L55 82 L57 70 L48 61 L60 59 Z" fill="#0b192c"/>

    <!-- Text Info -->
    <text x="120" y="55" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#ffffff">Tatag Utomo, M.M., M.Si.</text>
    <text x="120" y="85" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#f6d365">Founder &amp; Master Trainer KPPSM</text>
    <text x="120" y="112" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="14" fill="#cbd5e1">20+ Tahun Pengalaman • Penulis 4 Buku PT Grassindo</text>
  </g>
</svg>
