<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="galEduBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#galEduBg)"/>
  
  <!-- Academic & Campus Partnership Motif -->
  <g transform="translate(220, 80)">
    <!-- Graduation Cap / Institutional Crest -->
    <polygon points="180,30 290,80 180,130 70,80" fill="#0f172a"/>
    <rect x="120" y="95" width="120" height="60" rx="30" fill="#1e293b"/>
    <line x1="260" y1="90" x2="260" y2="170" stroke="#fbbf24" stroke-width="4"/>
    <circle cx="260" cy="175" r="8" fill="#fbbf24"/>
    <!-- Partnership Handshake -->
    <rect x="90" y="180" width="180" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="180" y="217" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#854d0e" text-anchor="middle">KERJASAMA RESMI</text>
  </g>

  <!-- Title & Details Overlay -->
  <rect x="40" y="440" width="720" height="120" rx="16" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
  <text x="70" y="485" font-family="'Outfit', sans-serif" font-size="26" font-weight="800" fill="#ffffff">Kerjasama Polbangtan &amp; Institusi</text>
  <text x="70" y="520" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#94a3b8">Pelatihan mentalitas agropreneur dan kepemimpinan generasi muda</text>
  <g transform="translate(620, 470)">
    <rect width="110" height="34" rx="17" fill="#eab308"/>
    <text x="55" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#0f172a" text-anchor="middle">KEMITRAAN</text>
  </g>
</svg>
