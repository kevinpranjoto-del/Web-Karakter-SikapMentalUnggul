<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="100%" height="100%">
  <defs>
    <linearGradient id="bookBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091b33"/>
      <stop offset="40%" stop-color="#14365d"/>
      <stop offset="100%" stop-color="#05101f"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow3D">
      <feDropShadow dx="15" dy="20" stdDeviation="15" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Book Base -->
  <g filter="url(#shadow3D)">
    <rect x="50" y="30" width="500" height="780" rx="16" fill="url(#bookBg1)"/>
    <!-- Spine Accent -->
    <rect x="50" y="30" width="25" height="780" rx="4" fill="rgba(0,0,0,0.3)"/>
    <line x1="75" y1="30" x2="75" y2="810" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    
    <!-- Decorative Header Band -->
    <rect x="90" y="70" width="420" height="6" fill="url(#goldAcc)"/>

    <!-- Publisher Tag -->
    <g transform="translate(90, 95)">
      <rect width="150" height="28" rx="4" fill="rgba(255,255,255,0.1)"/>
      <text x="75" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="1">PT. GRASSINDO</text>
    </g>

    <!-- Category Pill -->
    <g transform="translate(90, 150)">
      <rect width="210" height="32" rx="16" fill="#f59e0b"/>
      <text x="105" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#0f172a" text-anchor="middle">BEST SELLER SDM &amp; BISNIS</text>
    </g>

    <!-- Main Title -->
    <text x="90" y="240" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="-0.5">MENGGUGAH</text>
    <text x="90" y="295" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="#fbbf24" letter-spacing="-0.5">MENTALITAS</text>
    <text x="90" y="348" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" fill="#ffffff">PROFESIONAL &amp;</text>
    <text x="90" y="395" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="800" fill="#93c5fd">PENGUSAHA INDONESIA</text>

    <!-- Geometric Graphic Element -->
    <g transform="translate(90, 440)">
      <circle cx="210" cy="110" r="95" fill="none" stroke="rgba(245, 158, 11, 0.3)" stroke-width="2"/>
      <circle cx="210" cy="110" r="70" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
      <polygon points="210,45 270,145 150,145" fill="none" stroke="#f59e0b" stroke-width="3"/>
      <!-- Growth Arrow -->
      <path d="M160 160 L210 90 L260 160" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
      <line x1="210" y1="90" x2="210" y2="180" stroke="#38bdf8" stroke-width="4"/>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="300" y="690" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" fill="#cbd5e1" text-anchor="middle" font-weight="500">Transformasi Pola Pikir Menjadi Pemenang &amp; Berdaya Saing</text>

    <!-- Author Badge -->
    <rect x="90" y="720" width="420" height="55" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5"/>
    <text x="300" y="754" font-family="'Outfit', sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">Tatag Utomo, M.M., M.Si.</text>
  </g>
</svg>
