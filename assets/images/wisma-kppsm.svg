<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="bldgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="wismaShadow">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0b192c" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="900" height="600" fill="url(#skyGrad)"/>

  <!-- Sun / Light Glow -->
  <circle cx="750" cy="120" r="100" fill="#fef08a" opacity="0.35" filter="blur(30px)"/>
  <circle cx="750" cy="120" r="45" fill="#ffffff" opacity="0.9"/>

  <!-- Distant Trees -->
  <path d="M0 450 Q120 400 240 430 Q380 390 520 420 Q680 380 900 440 L900 600 L0 600 Z" fill="#14532d" opacity="0.6"/>
  <path d="M0 480 Q160 440 320 470 Q500 430 700 460 Q820 440 900 470 L900 600 L0 600 Z" fill="#166534"/>

  <!-- Modern Wisma Building -->
  <!-- Main Hall Structure -->
  <g filter="url(#wismaShadow)">
    <rect x="180" y="240" width="540" height="260" rx="12" fill="url(#bldgGrad)"/>
    
    <!-- Modern Roof Canopy / Architectural Louvers -->
    <polygon points="150,240 750,240 720,210 180,210" fill="#0f172a"/>
    <rect x="150" y="235" width="600" height="12" fill="url(#woodGrad)" rx="3"/>

    <!-- Left Wing Wood Accent -->
    <rect x="200" y="260" width="130" height="240" fill="url(#woodGrad)" rx="6"/>
    <line x1="200" y1="300" x2="330" y2="300" stroke="#78350f" stroke-width="2"/>
    <line x1="200" y1="340" x2="330" y2="340" stroke="#78350f" stroke-width="2"/>
    <line x1="200" y1="380" x2="330" y2="380" stroke="#78350f" stroke-width="2"/>
    <line x1="200" y1="420" x2="330" y2="420" stroke="#78350f" stroke-width="2"/>

    <!-- Center Glass Lobby & Windows -->
    <rect x="350" y="270" width="220" height="140" rx="8" fill="url(#glassGrad)" stroke="#cbd5e1" stroke-width="4"/>
    <line x1="460" y1="270" x2="460" y2="410" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
    <line x1="350" y1="340" x2="570" y2="340" stroke="#ffffff" stroke-width="3" opacity="0.6"/>

    <!-- Main Glass Entrance Door -->
    <rect x="400" y="420" width="120" height="80" rx="4" fill="#0284c7" stroke="#0f172a" stroke-width="3"/>
    <line x1="460" y1="420" x2="460" y2="500" stroke="#0f172a" stroke-width="2"/>

    <!-- Right Window Panel -->
    <rect x="590" y="270" width="110" height="210" rx="6" fill="url(#glassGrad)" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="590" y1="340" x2="700" y2="340" stroke="#ffffff" stroke-width="2"/>
    <line x1="590" y1="410" x2="700" y2="410" stroke="#ffffff" stroke-width="2"/>

    <!-- Building Signboard: KPPSM -->
    <rect x="365" y="175" width="190" height="42" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="460" y="202" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" fill="#f59e0b" text-anchor="middle" letter-spacing="3">WISMA KPPSM</text>
  </g>

  <!-- Green Lawn & Walkway -->
  <polygon points="0,520 900,520 900,600 0,600" fill="#15803d"/>
  <polygon points="380,500 540,500 620,600 300,600" fill="#cbd5e1"/>

  <!-- Modern Information Pill -->
  <g transform="translate(40, 40)">
    <rect width="360" height="65" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>
    <circle cx="35" cy="32" r="18" fill="#f59e0b"/>
    <text x="35" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle">★</text>
    <text x="65" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Wisma KPPSM Cibubur Indah</text>
    <text x="65" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94a3b8">Pusat Pelatihan &amp; Retreat Sikap Mental</text>
  </g>
</svg>
